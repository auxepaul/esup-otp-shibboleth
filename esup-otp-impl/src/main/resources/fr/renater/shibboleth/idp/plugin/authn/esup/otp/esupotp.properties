###############################
#  EsupOtp configuration      #
###############################

## SERVER CONFIG ##

# Required.
idp.esup.otp.apiHost =
# Valeurs à récupérer de esup-otp-api (via la base mongoDB, ou par CRUD /admin/tenant/:id)
idp.esup.otp.apiPassword =
idp.esup.otp.usersSecret =
# L'issuer correspond au tenant pour esup-otp-api, by default = %{idp.entityID}
idp.esup.otp.issuer = %{idp.entityID}
idp.esup.otp.manager.link = https://esup-otp-manager.univ.fr/preferences

# Optional.
# Liste des méthodes supportées pour le second facteur (doit matcher avec les méthodes retournées par esup-otp-api), by default = totp,webauthn,push,bypass,passcode_grid,random_code,random_code_mail
#idp.esup.otp.supportedMethods = totp,webauthn,push,bypass,passcode_grid, random_code,random_code_mail
# The bean name of the username lookup strategy. By default, this comes from the principal name established by the first factor.
#idp.esup.otp.username.strategy = DefaultUsernameLookupStrategy|SubjectContextUsernameLookupStrategy|UsernameWithScopeLookupStrategy|AttributeContextUsernameLookupStrategy|
# if idp.esup.otp.username.strategy = AttributeContextUsernameLookupStrategy set this below property
#idp.esup.otp.attributeId=eduPersonPrincipalName
# Resend code by sms or email (-1 no limit), by default = 3
#idp.esup.otp.send.counter = 3
# Length of the Otp code, (doit matcher avec la longueur de l'otp dans esup-otpt-api), by default = 6
#idp.esup.otp.codeLength = 6

